<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca de APIs</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111925;--line:#253246;--text:#e9eef8}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.app{height:100dvh;padding:16px;max-width:1600px;margin:auto;display:flex;flex-direction:column;overflow:hidden}.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-size:22px}.logo[hidden]{display:none}.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit}.brand h1{margin:0;font-size:21px}.brand p{margin:2px 0 0;color:#8c9ab1;font-size:12px}.layout{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.side,.main{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:0}.side{display:flex;flex-direction:column;overflow:hidden}.search{padding:12px;border-bottom:1px solid var(--line)}.search input{width:100%;padding:10px 12px;border:1px solid #2b3a50;background:#0b121c;border-radius:10px;color:var(--text);outline:none}.tree{overflow:auto;overscroll-behavior:contain;padding:8px;flex:1}.tree-node{display:flex;align-items:center}.tree-node button{border:0;background:none;color:#b7c4d8;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer}.tree-node button:hover,.tree-node button.active{background:#1d2b3d;color:#fff}.tree-node .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-node .toggle{width:23px;text-align:center;color:#8797ae}.tree-children{margin-left:13px;border-left:1px solid #2b3a50;padding-left:5px}.main{display:flex;flex-direction:column;overflow:hidden}.pathbar{flex:none;padding:13px 18px;border-bottom:1px solid var(--line);background:#131e2b;color:#93a4bb;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pathbar b{color:#dfe9f7}.content{padding:22px;overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}.content h2{margin:0 0 18px;font-size:24px}.entry-body{color:var(--text);background:#141e2a;border:1px solid #253246;border-radius:12px;padding:18px;margin-bottom:14px;overflow-wrap:anywhere}.entry-body img{max-width:100%;height:auto;border-radius:8px}.entry-body a{color:#61c7f1}.divider{height:1px;background:linear-gradient(90deg,transparent,#385570,transparent);margin:0 0 14px}.empty{text-align:center;border:1px dashed #34445a;border-radius:14px;padding:40px 20px;color:#8393aa}.empty strong{display:block;color:#cbd7e7;font-size:16px;margin-bottom:5px}.notice{color:#c5d3e4;text-align:center;margin:auto;padding:35px;max-width:560px}.notice h2{color:white}.notice a{color:#61c7f1}.error{color:#ff9a9a}
body{background:var(--theme-bg,#090d14);color:var(--theme-text,#e9eef8)}.side,.main{background:var(--theme-panel,#111925);border-color:var(--theme-border,#253246)}.pathbar{background:var(--theme-panel,#111925);border-color:var(--theme-border,#253246);color:var(--theme-muted,#8c9ab1)}.entry-body{color:var(--theme-text,#e9eef8);background:var(--theme-card,#141e2a);border-color:var(--theme-border,#253246)}.entry-body a,.notice a{color:var(--theme-link,#61c7f1)}.tree-node button{color:var(--theme-text,#e9eef8)}.tree-node button:hover,.tree-node button.active{background:var(--theme-button,#1a2737);color:var(--theme-button-text,#dce7f5)}.search input{background:var(--theme-input,#0b121c);color:var(--theme-text,#e9eef8);border-color:var(--theme-border,#253246)}.tree-children{border-color:var(--theme-border,#253246)}.brand p,.empty,.notice{color:var(--theme-muted,#8c9ab1)}.pathbar b,.empty strong,.content h2,.notice h2{color:var(--theme-text,#e9eef8)}.empty{border-color:var(--theme-border,#253246)}.divider{background:var(--theme-border,#385570)}
:root{--theme-button-text:var(--theme-buttonText,#dce7f5)}
@media(max-width:700px){.app{padding:10px}.layout{grid-template-columns:190px minmax(0,1fr);gap:9px}.brand h1{font-size:16px}.brand p{display:none}.logo{width:34px;height:34px}.content{padding:13px}.content h2{font-size:20px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo" id="logo" hidden></div><div><h1 id="title">Biblioteca de APIs</h1><p id="subtitle"></p></div></div></header><div class="layout"><aside class="side"><div class="search"><input id="search" type="search" placeholder="Buscar categorias y contenido..."></div><nav class="tree" id="tree"></nav></aside><main class="main"><div class="pathbar" id="path">Biblioteca</div><div class="content" id="content"><div class="notice">Cargando la biblioteca...</div></div></main></div></div>
<script>
const GIST_FILE="API - X18Hrs",DEFAULT_GIST_ID="19127a8de154850715c71eb2a9926602",gistId=new URLSearchParams(location.search).get("gist")||DEFAULT_GIST_ID;let data=null,selected=new URLSearchParams(location.hash.slice(1)).get("category")||null;
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setTheme(theme){if(!theme)return;for(const [key,value] of Object.entries(theme))document.documentElement.style.setProperty("--theme-"+key.replace(/[A-Z]/g,m=>"-"+m.toLowerCase()),value)}
function makeTree(){const root={name:"",children:new Map(),category:null};for(const cat of data.categories){let node=root;for(const part of cat.path.split("/").map(x=>x.trim()).filter(Boolean)){if(!node.children.has(part))node.children.set(part,{name:part,children:new Map(),category:null});node=node.children.get(part)}node.category=cat}return root}
function matches(node,q){return node.name.toLowerCase().includes(q)||(node.category&&node.category.blocks.some(b=>String(b.html||"").toLowerCase().includes(q)))||[...node.children.values()].some(child=>matches(child,q))}
function render(){const nav=document.getElementById("tree"),content=document.getElementById("content"),q=document.getElementById("search").value.trim().toLowerCase();nav.innerHTML="";if(!data)return;document.getElementById("title").textContent=data.title||"Biblioteca de APIs";document.getElementById("subtitle").textContent=data.subtitle||"";const logo=document.getElementById("logo");logo.innerHTML=data.icon&&data.icon.startsWith("data:image/")?'<img src="'+data.icon+'" alt="">':'';logo.hidden=!(data.icon&&data.icon.startsWith("data:image/"));const root=makeTree();function draw(parent,container){for(const node of parent.children.values()){if(q&&!matches(node,q))continue;const row=document.createElement("div");row.className="tree-node";row.innerHTML='<button class="toggle" aria-label="Expandir">'+(node.children.size?"&#9662;":"")+'</button><button class="label">'+escapeHtml(node.name)+'</button>';container.append(row);const label=row.querySelector(".label");if(node.category){if(node.category.id===selected)label.classList.add("active");label.onclick=()=>{selected=node.category.id;render()}}else label.style.cursor="default";if(node.children.size){const kids=document.createElement("div");kids.className="tree-children";container.append(kids);draw(node,kids);row.querySelector(".toggle").onclick=()=>{kids.hidden=!kids.hidden;row.querySelector(".toggle").innerHTML=kids.hidden?"&#9656;":"&#9662;"}}}}draw(root,nav);let cat=data.categories.find(c=>c.id===selected);if(!cat){cat=data.categories[0];selected=cat?.id}if(!cat){document.getElementById("path").textContent="Biblioteca";content.innerHTML='<div class="empty">Este Gist no tiene categorias.</div>';return}document.getElementById("path").innerHTML="Biblioteca &rsaquo; <b>"+cat.path.split("/").map(escapeHtml).join(" &rsaquo; ")+"</b>";content.innerHTML="<h2>"+escapeHtml(cat.path.split("/").at(-1))+"</h2>"+(cat.blocks?.length?cat.blocks.map((b,i)=>(i?'<div class="divider"></div>':"")+'<article class="entry-body">'+(b.html||"")+'</article>').join(""):'<div class="empty">Aun no hay informacion en esta categoria.</div>')}
async function loadGist(){try{const response=await fetch("https://api.github.com/gists/"+encodeURIComponent(gistId),{headers:{Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2026-03-10"},cache:"no-store"}),gist=await response.json();if(!response.ok)throw Error(gist.message||"No se pudo leer el Gist.");const file=gist.files?.[GIST_FILE];if(!file)throw Error("No se encontro "+GIST_FILE+" dentro del Gist.");let contents=file.content;if(file.truncated||!contents){const raw=await fetch(file.raw_url,{cache:"no-store"});if(!raw.ok)throw Error("No se pudo descargar el archivo del Gist.");contents=await raw.text()}data=JSON.parse(contents);if(!Array.isArray(data.categories)){if(data&&Object.keys(data).length===0){document.getElementById("content").innerHTML='<div class="notice"><h2>El Gist aun esta vacio</h2><p>Abre el editor, carga tu borrador local y pulsa Publicar cambios para inicializarlo.</p><a href="index.html?gist='+encodeURIComponent(gistId)+'">Ir al editor</a></div>';return}throw Error("El Gist no contiene una lista valida de categorias.")}setTheme(data.theme);render()}catch(error){document.getElementById("content").innerHTML='<div class="notice"><h2>No se pudo cargar la biblioteca</h2><p class="error">'+escapeHtml(error.message)+"</p><p>Comprueba el ID del Gist y el nombre del archivo "+GIST_FILE+".</p></div>"}}
document.getElementById("search").oninput=render;window.addEventListener("hashchange",()=>{selected=new URLSearchParams(location.hash.slice(1)).get("category")||null;render()});loadGist();
</script></body></html>
