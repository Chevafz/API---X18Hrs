<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi biblioteca de APIs</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111925;--line:#253246;--text:#e9eef8}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.app{height:100dvh;padding:16px;max-width:1600px;margin:auto;display:flex;flex-direction:column;overflow:hidden}.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-size:22px}.brand h1{margin:0;font-size:21px}.brand p{margin:2px 0 0;color:#8c9ab1;font-size:12px}.layout{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.side,.main{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:0}.side{display:flex;flex-direction:column;overflow:hidden}.search{padding:12px;border-bottom:1px solid var(--line)}.search input{width:100%;padding:10px 12px;border:1px solid #2b3a50;background:#0b121c;border-radius:10px;color:var(--text);outline:none}.tree{overflow:auto;overscroll-behavior:contain;padding:8px;flex:1}.tree-node{display:flex;align-items:center}.tree-node button{border:0;background:none;color:#b7c4d8;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer}.tree-node button:hover,.tree-node button.active{background:#1d2b3d;color:#fff}.tree-node .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-node .toggle{width:23px;text-align:center;color:#8797ae}.tree-children{margin-left:13px;border-left:1px solid #2b3a50;padding-left:5px}.side-foot{padding:10px;border-top:1px solid var(--line);color:#718199;font-size:11px}.main{display:flex;flex-direction:column;overflow:hidden}.pathbar{flex:none;padding:13px 18px;border-bottom:1px solid var(--line);background:#131e2b;color:#93a4bb;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pathbar b{color:#dfe9f7}.content{padding:22px;overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}.content h2{margin:0 0 18px;font-size:24px}.entry-body{padding:18px 0;overflow-wrap:anywhere}.entry-body img{max-width:100%;height:auto;border-radius:8px}.entry-body a{color:#61c7f1}.divider{height:1px;background:linear-gradient(90deg,transparent,#385570,transparent)}.empty{text-align:center;border:1px dashed #34445a;border-radius:14px;padding:40px 20px;color:#8393aa}.empty strong{display:block;color:#cbd7e7;font-size:16px;margin-bottom:5px}.notice{color:#c5d3e4;text-align:center;margin:auto;padding:35px;max-width:520px}.notice h2{color:white}@media(max-width:700px){.app{padding:10px}.layout{grid-template-columns:190px minmax(0,1fr);gap:9px}.brand h1{font-size:16px}.brand p{display:none}.logo{width:34px;height:34px}.content{padding:13px}.content h2{font-size:20px}}
</style><style>
.side-foot{display:none}.logo[hidden]{display:none}.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
body{background:var(--theme-bg,#090d14);color:var(--theme-text,#e9eef8)}.side,.main{background:var(--theme-panel,#111925);border-color:var(--theme-border,#253246)}.pathbar{background:var(--theme-panel,#111925);border-color:var(--theme-border,#253246)}
.entry-body{color:var(--theme-text,#e9eef8);background:var(--theme-card,#141e2a);border:1px solid var(--theme-border,#253246);border-radius:12px;padding:18px;margin-bottom:14px}.entry-body a{color:var(--theme-link,#61c7f1)}.tree-node button{color:var(--theme-text,#e9eef8)}.tree-node button:hover,.tree-node button.active{background:var(--theme-button,#1a2737);color:var(--theme-button-text,#dce7f5)}
.search input{background:var(--theme-input,#0b121c);color:var(--theme-text,#e9eef8);border-color:var(--theme-border,#253246)}.crumb,.brand p,.empty{color:var(--theme-muted,#8c9ab1)}.pathbar b,.empty strong,.content h2{color:var(--theme-text,#e9eef8)}.empty{border-color:var(--theme-border,#253246)}.divider{background:var(--theme-border,#385570)}
</style><style>:root{--theme-button-text:var(--theme-buttonText,#dce7f5);--theme-accent-text:var(--theme-accentText,#fff)}</style><script>document.addEventListener("DOMContentLoaded",()=>{const applyTheme=theme=>{if(!theme)return;for(const [key,value] of Object.entries(theme))document.documentElement.style.setProperty("--theme-"+key,value)};applyTheme(data?.theme);window.addEventListener("storage",e=>{if(e.key==="api-page-v1"){try{applyTheme(JSON.parse(e.newValue)?.theme)}catch(_){}}});const input=document.getElementById("search");input.addEventListener("input",()=>{const q=input.value.toLowerCase();if(!q)return;input.value="";render();input.value=q;function filter(container,prefix){let found=false;for(const row of [...container.children].filter(x=>x.classList.contains("tree-node"))){const name=row.querySelector(".label").textContent,path=prefix?prefix+"/"+name:name,kids=row.nextElementSibling?.classList.contains("tree-children")?row.nextElementSibling:null,cat=data?.categories.find(c=>c.path.toLowerCase()===path.toLowerCase()),self=path.toLowerCase().includes(q)||(cat&&cat.blocks.some(b=>b.html.toLowerCase().includes(q))),desc=kids?filter(kids,path):false;row.hidden=!self&&!desc;if(kids)kids.hidden=!desc;found=found||self||desc}return found}filter(document.getElementById("tree"),"")});const go=()=>{const id=new URLSearchParams(location.hash.slice(1)).get("category");if(id&&data?.categories.some(c=>c.id===id)){selected=id;render()}};go();window.addEventListener("hashchange",go);const localGetData=getData;let sharedData=null;getData=()=>sharedData||localGetData();fetch("./data.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Sin archivo publicado");return r.json()}).then(d=>{if(!d||!Array.isArray(d.categories))return;sharedData=d;selected=new URLSearchParams(location.hash.slice(1)).get("category")||null;applyTheme(d.theme);render()}).catch(()=>{})});</script></head><body><div class="app"><header class="top"><div class="brand"><div class="logo" id="logo" hidden></div><div><h1 id="title">Mi biblioteca de APIs</h1><p id="subtitle"></p></div></div></header><div class="layout"><aside class="side"><div class="search"><input id="search" type="search" placeholder="Buscar categorias y contenido..."></div><nav class="tree" id="tree"></nav></aside><main class="main"><div class="pathbar" id="path">Biblioteca</div><div class="content" id="content"></div></main></div></div>
<script>
const KEY="api-page-v1";let data=null,selected=null;function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function getData(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.categories)?d:null}catch(e){return null}}function treeData(){let root={children:new Map(),category:null};data.categories.forEach(c=>{let n=root;c.path.split("/").map(x=>x.trim()).filter(Boolean).forEach(part=>{if(!n.children.has(part))n.children.set(part,{name:part,children:new Map(),category:null});n=n.children.get(part)});n.category=c});return root}function render(){data=getData();let nav=document.getElementById("tree"),content=document.getElementById("content"),q=document.getElementById("search").value.toLowerCase();nav.innerHTML="";if(!data){document.getElementById("title").textContent="Mi biblioteca de APIs";document.getElementById("subtitle").textContent="";document.getElementById("logo").hidden=true;document.getElementById("path").textContent="Biblioteca";content.innerHTML='<div class="notice"><h2>Aun no hay informacion disponible</h2><p>Abre el editor en este mismo navegador y agrega las categorias y la documentacion.</p><a href="index.html">Ir al editor</a></div>';return}document.getElementById("title").textContent=data.title;document.getElementById("subtitle").textContent=data.subtitle||"";let logo=document.getElementById("logo");logo.innerHTML=data.icon&&data.icon.startsWith("data:image/")?'<img src="'+data.icon+'" alt="">':'';logo.hidden=!(data.icon&&data.icon.startsWith("data:image/"));let root=treeData();function draw(parent,container){for(let n of parent.children.values()){let visible=!q||n.name.toLowerCase().includes(q)||[...n.children.values()].some(x=>x.name.toLowerCase().includes(q))||(n.category&&n.category.blocks.some(b=>b.html.toLowerCase().includes(q)));if(!visible)continue;let row=document.createElement("div");row.className="tree-node";row.innerHTML='<button class="toggle">'+(n.children.size?"&#9656;":"")+'</button><button class="label">'+esc(n.name)+'</button>';container.append(row);let label=row.querySelector(".label");if(n.category){if(n.category.id===selected)label.classList.add("active");label.onclick=()=>{selected=n.category.id;render()}}else label.style.cursor="default";if(n.children.size){let kids=document.createElement("div");kids.className="tree-children";container.append(kids);draw(n,kids);row.querySelector(".toggle").onclick=()=>{kids.hidden=!kids.hidden;row.querySelector(".toggle").innerHTML=kids.hidden?"&#9656;":"&#9662;"}}}}draw(root,nav);let cat=data.categories.find(c=>c.id===selected);if(!cat){cat=data.categories[0];selected=cat?.id}if(!cat){document.getElementById("path").textContent="Biblioteca";content.innerHTML='<div class="empty">No hay categorias.</div>';return}document.getElementById("path").innerHTML="Biblioteca &rsaquo; <b>"+cat.path.split("/").map(esc).join(" &rsaquo; ")+"</b>";content.innerHTML="<h2>"+esc(cat.path.split("/").at(-1))+"</h2>"+(cat.blocks.length?cat.blocks.map((b,i)=>(i?'<div class="divider"></div>':"")+'<article class="entry-body">'+(b.html||"")+'</article>').join(""):'<div class="empty">Aun no hay informacion en esta categoria.</div>')}document.getElementById("search").oninput=render;window.addEventListener("storage",e=>{if(e.key===KEY)render()});render();
</script></body></html>
