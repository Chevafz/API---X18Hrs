const DEFAULT_GIST_ID="19127a8de154850715c71eb2a9926602",DEFAULT_GIST_FILE="API - X18Hrs",GIST_CONFIG_KEY="api-page-gist-config";function readGistConfig(){try{return JSON.parse(localStorage.getItem(GIST_CONFIG_KEY))||{}}catch(e){return{}}}function gistIdFrom(value){const match=value.trim().match(/[a-f0-9]{20,}/i);return match?match[0]:""}function setGhStatus(message,error=false){const s=document.getElementById("ghStatus");s.textContent=message;s.style.color=error?"#ff8585":"var(--theme-muted,#8c9ab1)"}function gistHeaders(token){const h={Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2026-03-10"};if(token)h.Authorization="Bearer "+token;return h}async function readGist(id,fileName,token=""){const r=await fetch("https://api.github.com/gists/"+encodeURIComponent(id),{headers:gistHeaders(token),cache:"no-store"});const body=await r.json();if(!r.ok)throw Error(body.message||"No se pudo cargar el Gist.");const file=body.files?.[fileName];if(!file)throw Error("El Gist no contiene el archivo "+fileName+".");let text=file.content;if(file.truncated||!text){const raw=await fetch(file.raw_url,{cache:"no-store"});if(!raw.ok)throw Error("No se pudo descargar el contenido completo del Gist.");text=await raw.text()}return{data:JSON.parse(text),gist:body}}function saveGistConfig(id,fileName){localStorage.setItem(GIST_CONFIG_KEY,JSON.stringify({id,file:fileName}));document.getElementById("gistId").value=id;document.getElementById("gistFile").value=fileName;const link=document.querySelector(".top-actions a");if(link)link.href="view.html?gist="+encodeURIComponent(id)}
const oldGist=readGistConfig(),initialGistId=oldGist.id||DEFAULT_GIST_ID,initialGistFile=oldGist.file||DEFAULT_GIST_FILE;document.getElementById("gistId").value=initialGistId;document.getElementById("gistFile").value=initialGistFile;{const link=document.querySelector(".top-actions a");if(link)link.href="view.html?gist="+encodeURIComponent(initialGistId)}githubButton.onclick=()=>{setGhStatus("");githubDialog.showModal()};document.getElementById("ghClose").onclick=()=>{document.getElementById("ghToken").value="";githubDialog.close()};githubDialog.oncancel=()=>{document.getElementById("ghToken").value=""};
document.getElementById("ghLoad").onclick=async()=>{const token=document.getElementById("ghToken").value.trim();try{const id=gistIdFrom(document.getElementById("gistId").value),fileName=document.getElementById("gistFile").value.trim();if(!id)throw Error("Escribe el ID o la URL del Gist.");if(!fileName)throw Error("Escribe el nombre exacto del archivo del Gist.");setGhStatus("Cargando Gist...");const result=await readGist(id,fileName,token);saveGistConfig(id,fileName);if(!Array.isArray(result.data.categories)&&Object.keys(result.data).length===0){setGhStatus("El Gist esta vacio. Conservo el borrador local; pulsa Publicar cambios para inicializarlo.");return}if(!Array.isArray(result.data.categories))throw Error("El archivo del Gist no contiene una lista valida de categorias.");state=result.data;state.theme={...THEME_DEFAULTS,...(state.theme||{})};selected=state.categories[0]?.id||null;save();applyTheme(state.theme);render();setGhStatus("Gist cargado. Enlace para compartir: "+location.href.replace(/[^/]*$/, "view.html?gist="+encodeURIComponent(id)))}catch(err){setGhStatus(err.message,true)}finally{document.getElementById("ghToken").value=""}};
document.getElementById("ghPublish").onclick=async()=>{const token=document.getElementById("ghToken").value.trim();try{if(!token)throw Error("Pega un token con permiso Gists: write.");let id=gistIdFrom(document.getElementById("gistId").value);const fileName=document.getElementById("gistFile").value.trim()||DEFAULT_GIST_FILE,method=id?"PATCH":"POST",url=id?"https://api.github.com/gists/"+encodeURIComponent(id):"https://api.github.com/gists",payload={description:state.title||"Biblioteca de APIs",files:{[fileName]:{content:JSON.stringify(state,null,2)}}};if(!id)payload.public=true;setGhStatus(id?"Actualizando Gist...":"Creando un Gist publico...");const response=await fetch(url,{method,headers:{...gistHeaders(token),"Content-Type":"application/json"},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok)throw Error(result.message||"GitHub no pudo guardar el Gist.");saveGistConfig(result.id,fileName);save();const share=location.href.replace(/[^/]*$/, "view.html?gist="+encodeURIComponent(result.id));setGhStatus("Publicado en el Gist. Comparte este enlace: "+share)}catch(err){setGhStatus(err.message,true)}finally{document.getElementById("ghToken").value=""}};

<div class="app"><header class="top"><div class="brand"><div class="logo" id="logo" hidden></div><div><h1 id="pageTitle">Mi biblioteca de APIs</h1><p id="pageSubtitle">Editor de documentacion</p></div></div><div class="top-actions"><button class="btn" id="rename">Editar encabezado</button><button class="btn" id="loadIcon">Cargar icono</button><button class="btn primary" id="newCategory">+ Categoria</button><a class="btn" href="view.html">Ver pagina</a></div></header>
<div class="layout"><aside class="side"><div class="search"><input id="search" type="search" placeholder="Buscar categorias y contenido..."></div><nav class="tree" id="tree"></nav></aside><main class="main"><div class="pathbar"><div class="crumb" id="crumb"></div><button class="btn small" id="editPath">Cambiar ruta</button></div><div class="content"><div class="category-head"><div><h2 id="categoryTitle"></h2><p id="categoryNote">Informacion y recursos de esta categoria</p></div><button class="btn primary" id="addBlock">+ Agregar informacion</button></div><section id="blocks"></section><div class="empty" id="empty"><strong>Aun no hay informacion en esta categoria</strong>Agrega un bloque para documentar tu API.</div></div></main></div></div><div class="toast" id="toast"></div><input id="filePicker" type="file" accept="image/*" hidden><input id="iconPicker" type="file" accept="image/*" hidden>
<script>
const KEY="api-page-v1";const THEME_DEFAULTS={bg:"#090d14",panel:"#111925",card:"#141e2a",text:"#e9eef8",muted:"#8c9ab1",button:"#1a2737",buttonText:"#dce7f5",accent:"#176da0",accentText:"#ffffff",border:"#253246",link:"#61c7f1",input:"#0b121c",danger:"#ff9a9a"};let state=load(),selected=state.categories[0]?.id||null,pending=null;
function uid(){return Math.random().toString(36).slice(2,10)}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v?.categories){if(v.subtitle===undefined)v.subtitle="Editor de documentacion";v.theme={...THEME_DEFAULTS,...(v.theme||{})};return v}}catch(e){}return{title:"Mi biblioteca de APIs",subtitle:"Editor de documentacion",icon:"",theme:{...THEME_DEFAULTS},categories:[{id:uid(),path:"Fisicas/Gravedad",blocks:[]},{id:uid(),path:"Fisicas/Mecanicas/Salto",blocks:[]}]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function applyTheme(theme){Object.entries(theme||THEME_DEFAULTS).forEach(([k,v])=>document.documentElement.style.setProperty("--theme-"+k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase()),v))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function treeData(){let root={name:"",children:new Map(),category:null};state.categories.forEach(c=>{let n=root;c.path.split("/").map(x=>x.trim()).filter(Boolean).forEach(part=>{if(!n.children.has(part))n.children.set(part,{name:part,children:new Map(),category:null});n=n.children.get(part)});n.category=c});return root}
function nodeMatches(n,q){return n.name.toLowerCase().includes(q)||(n.category&&n.category.blocks.some(b=>b.html.toLowerCase().includes(q)))||[...n.children.values()].some(child=>nodeMatches(child,q))}
function renderTree(){let nav=document.getElementById("tree"),q=document.getElementById("search").value.toLowerCase(),root=treeData();nav.innerHTML="";function draw(parent,container){for(let n of parent.children.values()){let visible=!q||nodeMatches(n,q);if(!visible)continue;let row=document.createElement("div"),item=document.createElement("div");row.className="tree-node";let hasKids=n.children.size>0;item.innerHTML='<button class="toggle" aria-label="Expandir">'+(hasKids?"&#9656;":"")+'</button><button class="label">'+esc(n.name)+'</button>'+(n.category?'<button class="del" title="Eliminar categoria" aria-label="Eliminar categoria">&#215;</button>':"");row.append(item);container.append(row);let label=item.querySelector(".label");if(n.category){if(n.category.id===selected)label.classList.add("active");label.onclick=()=>{selected=n.category.id;render()};item.querySelector(".del").onclick=()=>{let c=n.category;if(confirm('Eliminar "'+c.path+'" y toda su informacion?')){state.categories=state.categories.filter(x=>x.id!==c.id);if(selected===c.id)selected=state.categories[0]?.id||null;save();render()}}}if(hasKids){let kids=document.createElement("div");kids.className="tree-children";container.append(kids);draw(n,kids);item.querySelector(".toggle").onclick=()=>{kids.hidden=!kids.hidden;item.querySelector(".toggle").innerHTML=kids.hidden?"&#9656;":"&#9662;"}}}}draw(root,nav)}
function render(){document.getElementById("pageTitle").textContent=state.title;document.getElementById("pageSubtitle").textContent=state.subtitle||"";let logo=document.getElementById("logo");logo.innerHTML=state.icon&&state.icon.startsWith("data:image/")?'<img src="'+state.icon+'" alt="">':'';logo.hidden=!(state.icon&&state.icon.startsWith("data:image/"));renderTree();let cat=state.categories.find(c=>c.id===selected);if(!cat){document.getElementById("categoryTitle").textContent="Sin categorias";document.getElementById("crumb").textContent="Biblioteca";document.getElementById("blocks").innerHTML="";document.getElementById("empty").style.display="block";return}document.getElementById("crumb").innerHTML="Biblioteca &rsaquo; <b>"+cat.path.split("/").map(esc).join(" &rsaquo; ")+"</b>";document.getElementById("categoryTitle").textContent=cat.path.split("/").at(-1);let wrap=document.getElementById("blocks");wrap.innerHTML="";document.getElementById("empty").style.display=cat.blocks.length?"none":"block";cat.blocks.forEach((block,i)=>{if(i){let line=document.createElement("div");line.className="divider";wrap.append(line)}let card=document.createElement("article");card.className="entry";card.innerHTML='<div class="entry-body" contenteditable="true" data-id="'+block.id+'">'+(block.html||"")+'</div><div class="entry-tools"><button class="btn small" data-act="bold"><b>B</b></button><button class="btn small" data-act="italic"><i>I</i></button><button class="btn small" data-act="insertUnorderedList">Lista</button><select class="fontSize" title="Tamano"><option value="3">Normal</option><option value="4">Grande</option><option value="5">Muy grande</option><option value="2">Pequeno</option></select><input type="color" class="color" value="#dce7f5" title="Color de texto"><button class="btn small" data-act="createLink">Enlace</button><button class="btn small attach">+ Imagen</button><span class="spacer"></span><button class="btn small confirm">Confirmar</button><button class="btn small danger delete">Eliminar bloque</button></div>';wrap.append(card);let ed=card.querySelector(".entry-body");card.querySelectorAll("[data-act]").forEach(btn=>btn.onclick=()=>{ed.focus();if(btn.dataset.act==="createLink"){let url=prompt("Pega la direccion del enlace:");if(url)document.execCommand("createLink",false,url)}else document.execCommand(btn.dataset.act,false,null);block.html=ed.innerHTML;save()});card.querySelector(".fontSize").onchange=e=>{ed.focus();document.execCommand("fontSize",false,e.target.value);block.html=ed.innerHTML;save()};card.querySelector(".color").oninput=e=>{ed.focus();document.execCommand("foreColor",false,e.target.value);block.html=ed.innerHTML;save()};card.querySelector(".attach").onclick=()=>{pending=block.id;document.getElementById("filePicker").click()};card.querySelector(".confirm").onclick=()=>{block.html=ed.innerHTML;save();toast("Bloque guardado")};card.querySelector(".delete").onclick=()=>{if(confirm("Eliminar este bloque?")){cat.blocks.splice(i,1);save();render()}};ed.oninput=()=>{block.html=ed.innerHTML;save()}})}
document.getElementById("newCategory").onclick=()=>{let path=prompt("Ruta de categoria (usa / para cada nivel):","Fisicas/Nueva categoria");if(!path)return;path=path.split("/").map(x=>x.trim()).filter(Boolean).join("/");if(!path)return;if(state.categories.some(c=>c.path.toLowerCase()===path.toLowerCase())){alert("Ya existe una categoria con esa ruta.");return}let c={id:uid(),path,blocks:[]};state.categories.push(c);selected=c.id;save();render()};
document.getElementById("editPath").onclick=()=>{let c=state.categories.find(x=>x.id===selected);if(!c)return;let path=prompt("Edita la ruta usando / entre niveles:",c.path);if(path){path=path.split("/").map(x=>x.trim()).filter(Boolean).join("/");if(state.categories.some(x=>x.id!==c.id&&x.path.toLowerCase()===path.toLowerCase())){alert("Ya existe una categoria con esa ruta.");return}c.path=path;save();render()}};
document.getElementById("addBlock").onclick=()=>{let c=state.categories.find(x=>x.id===selected);if(c){let b={id:uid(),html:""};c.blocks.push(b);save();render();document.querySelector('.entry-body[data-id="'+b.id+'"]')?.focus()}};
document.getElementById("rename").onclick=()=>{let title=prompt("Titulo de la pagina:",state.title);if(title===null)return;let subtitle=prompt("Subtitulo de la pagina:",state.subtitle||"");if(subtitle===null)return;state.title=title.trim()||state.title;state.subtitle=subtitle.trim();save();render()};
document.getElementById("loadIcon").onclick=()=>document.getElementById("iconPicker").click();
document.getElementById("iconPicker").onchange=e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{state.icon=reader.result;save();render();e.target.value=""};reader.readAsDataURL(file)};
document.getElementById("search").oninput=render;
document.getElementById("filePicker").onchange=e=>{let file=e.target.files[0];if(!file||!pending)return;let reader=new FileReader();reader.onload=()=>{let ed=document.querySelector('.entry-body[data-id="'+pending+'"]');if(ed){ed.focus();document.execCommand("insertImage",false,reader.result);let cat=state.categories.find(x=>x.id===selected),b=cat?.blocks.find(x=>x.id===pending);if(b){b.html=ed.innerHTML;save()}}e.target.value="";pending=null};reader.readAsDataURL(file)};
applyTheme(state.theme);render();
</script></body></html>
